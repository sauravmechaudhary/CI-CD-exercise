name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies 
        run: npm ci  

      - name: Check style          
        run: npm run eslint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      # Exercise 18: Notification on build failure
      - name: Build Failure Notification
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Build Failed! Check the Actions tab for details.
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

  deploy_and_tag:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    # Run only on push to main AND if #skip is NOT in any commit message
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Trigger deployment
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

      # Exercise 18: Notification on deployment success
      - name: Deployment Success Notification
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: New version of Pokedex deployed successfully!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}